<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Aim Training</title>
</head>
<body>
<div class="screen">
    <h1>Aim Training</h1>
    <a href="#" class="start" id="start">Start game</a>
</div>

<div class="screen">
    <h1>Select a time</h1>
    <ul class="time-list" id="time-list">
        <li>
            <button class="time-btn" data-time="10">
                10 sec
            </button>
        </li>
        <li>
            <button class="time-btn" data-time="20">
                20 sec
            </button>
        </li>
        <li>
            <button class="time-btn" data-time="30">
                30 sec
            </button>
        </li>
    </ul>
</div>

<div class="screen">
    <h1>Select difficulty</h1>
    <ul class="difficulty-list" id="difficulty-list">
        <li>
            <button class="difficulty-btn" data-difficulty="easy">
                <div class="difficulty-title">Easy</div>
                <div class="difficulty-desc">Large stationary targets (40-60px)</div>
            </button>
        </li>
        <li>
            <button class="difficulty-btn" data-difficulty="medium">
                <div class="difficulty-title">Medium</div>
                <div class="difficulty-desc">Medium targets, slow movement (25-50px)</div>
            </button>
        </li>
        <li>
            <button class="difficulty-btn" data-difficulty="hard">
                <div class="difficulty-title">Hard</div>
                <div class="difficulty-desc">Small targets, fast movement (10-35px)</div>
            </button>
        </li>
        <li>
            <button class="difficulty-btn" data-difficulty="extreme">
                <div class="difficulty-title">Extreme</div>
                <div class="difficulty-desc">Tiny targets, very fast (8-20px)</div>
            </button>
        </li>
    </ul>
</div>

<div class="screen">
    <h3>Remains <span id="time">00:00</span></h3>
    <div class="board" id="board"></div>
    <button class="restart-btn hide" id="restart">Play Again</button>
</div>
<script src="app.js"></script>
</body>
</html>
